name: Publish stable ARM64 release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify tag matches the app version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "v${version_name}" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version v${version_name}."
            exit 1
          fi

      - name: Build ARM64 release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStandardRelease --stacktrace

      - name: Sign and checksum APK
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release-unsigned.apk"
          output="mpvEx-CN-arm64-v8a-${GITHUB_REF_NAME}.apk"
          echo "$SIGNING_KEYSTORE" | base64 -d > release.keystore
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$output" "$unsigned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$output"
          sha256sum "$output" > "$output.sha256"
          rm release.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: mpvEx 中文版 ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            mpvEx-CN-arm64-v8a-${{ github.ref_name }}.apk
            mpvEx-CN-arm64-v8a-${{ github.ref_name }}.apk.sha256
