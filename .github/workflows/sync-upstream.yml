name: Sync upstream

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/marlboro-advance/mpvEx.git
          git fetch upstream master --tags --force
          git merge --no-edit upstream/master
          git push origin HEAD:master

      - name: Mirror newest stable version tag
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$latest_tag" ]; then
            echo "No stable upstream tag found."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$latest_tag" >/dev/null 2>&1; then
            echo "$latest_tag is already mirrored."
          else
            git tag --force --annotate "$latest_tag" --message "mpvEx 中文版 $latest_tag" HEAD
            git push origin "refs/tags/$latest_tag"
          fi
